# Reference snippets for real IdPs. Copy the block you need into tenants.yaml.
tenants:
  # Google (OIDC). Console: APIs & Services > Credentials > OAuth client ID (Web application)
  # Authorized redirect URI: {SSO_BASE_URL}/auth/google/callback
  google:
    protocol: oidc
    display_name: Google
    issuer: https://accounts.google.com
    client_id: ${GOOGLE_CLIENT_ID}
    client_secret: ${GOOGLE_CLIENT_SECRET}
    scopes: [openid, email, profile]
    # Only allow company Google Workspace accounts.
    # extra_auth_params.hd only narrows the account chooser (UX, bypassable).
    # required_claims.hd is the server-side Workspace check; allowed_email_domains also
    # requires email_verified == true.
    extra_auth_params:
      hd: example.com
    required_claims:
      hd: example.com
    allowed_email_domains: [example.com]
    claims:
      subject: sub
      email: email
      name: name
      groups: null   # Google id_token has no groups

  # Microsoft Entra ID (OIDC), single tenant. Replace <tenant-id>.
  entra:
    protocol: oidc
    display_name: Microsoft Entra ID
    issuer: https://login.microsoftonline.com/<tenant-id>/v2.0
    client_id: ${ENTRA_CLIENT_ID}
    client_secret: ${ENTRA_CLIENT_SECRET}
    claims:
      subject: oid    # stable per user across apps; `sub` is per-app
      email: preferred_username
      name: name
      groups: groups  # requires "groups" optional claim in app registration
    roles:
      groups:
        "<admin-group-object-id>": [admin]

  # Generic SAML IdP (ADFS, Okta, ...) configured from metadata URL
  customer-saml:
    protocol: saml
    display_name: Customer SSO
    idp_metadata_url: https://idp.customer.example/federationmetadata.xml
    sp_cert_file: /run/secrets/sp.crt
    sp_key_file: /run/secrets/sp.key
    claims:
      subject: $nameid
      email: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress
      name: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name
      groups: http://schemas.microsoft.com/ws/2008/06/identity/claims/groups
